version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gestipro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestipro
      POSTGRES_USER: gestipro_user
      POSTGRES_PASSWORD: gestipro_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: gestipro_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gestipro_minio
      MINIO_ROOT_PASSWORD: gestipro_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestipro_api
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://gestipro_user:gestipro_pass@postgres:5432/gestipro
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 7d
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: gestipro_minio
      S3_SECRET_KEY: gestipro_minio_secret
      S3_BUCKET: gestipro-files
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestipro_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  minio_data:
