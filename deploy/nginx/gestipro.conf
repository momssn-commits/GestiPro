# =============================================================================
# GestiPro — Configuration Nginx
# Remplacer DOMAIN_PLACEHOLDER par votre domaine (ex: gestipro.ifs.sn)
# =============================================================================

upstream gestipro_frontend {
  server 127.0.0.1:3000;
  keepalive 64;
}

upstream gestipro_backend {
  server 127.0.0.1:4000;
  keepalive 64;
}

# ─── Redirection HTTP → HTTPS ─────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

# ─── Serveur principal HTTPS ──────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

  # SSL (généré par Certbot — ne pas modifier manuellement)
  ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Headers sécurité
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Taille maximale des uploads (25 Mo)
  client_max_body_size 30M;

  # Logs
  access_log /var/log/nginx/gestipro.access.log;
  error_log  /var/log/nginx/gestipro.error.log;

  # ── API Backend (/api/* et /uploads/*) ───────────────────────────────────
  location /api/ {
    proxy_pass         http://gestipro_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  location /uploads/ {
    proxy_pass         http://gestipro_backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location /health {
    proxy_pass http://gestipro_backend;
  }

  # ── Frontend Next.js (tout le reste) ─────────────────────────────────────
  location / {
    proxy_pass         http://gestipro_frontend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # ── Fichiers statiques Next.js (cache agressif) ──────────────────────────
  location /_next/static/ {
    proxy_pass http://gestipro_frontend;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
