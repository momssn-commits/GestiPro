# =============================================================================
# GestiPro — Configuration Nginx pour accès via IP (sans domaine / sans SSL)
# Usage temporaire avant de configurer un nom de domaine
# =============================================================================

upstream gestipro_frontend {
  server 127.0.0.1:3000;
  keepalive 64;
}

upstream gestipro_backend {
  server 127.0.0.1:4000;
  keepalive 64;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 30M;

  access_log /var/log/nginx/gestipro.access.log;
  error_log  /var/log/nginx/gestipro.error.log;

  # ── API Backend ──────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://gestipro_backend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://gestipro_backend;
    proxy_set_header Host $host;
    expires 7d;
  }

  location /health {
    proxy_pass http://gestipro_backend;
  }

  # ── Frontend Next.js ─────────────────────────────────────────────────────
  location / {
    proxy_pass         http://gestipro_frontend;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location /_next/static/ {
    proxy_pass http://gestipro_frontend;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
